# No KD: the student trains on ID + triplet loss only (reference point for the two KD recipes).
# Student: deformable ViT-Base/8, randomly initialised. Teacher: the ViT-Base/16 trained on this dataset.
# Everything outside KD is identical across baseline.yml / soft_kd.yml / dino_kd.yml for this dataset.
# IMS_PER_BATCH is the global batch: run with 2-GPU DDP (128 per GPU), as the teacher was;
# see slurm/kd/submit.sh.
MODEL:
  PRETRAIN_CHOICE: 'scratch'
  PRETRAIN_PATH: ''
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'deformable_vit_base_patch8_TransReID'
  STRIDE_SIZE: [8, 8]
  DROP_PATH: 0.1
  GRAD_CHECKPOINT: False
  DEFORM:
    BLOCKS: []
    GROUPS: 4
    DOWNSAMPLE: 2
    KERNEL: 5
    OFFSET_RANGE: 2.0

INPUT:
  SIZE_TRAIN: [256, 256]
  SIZE_TEST: [256, 256]
  PROB: 0.5 # random horizontal flip
  RE_PROB: 0.5 # random erasing
  PADDING: 10
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]
  NUM_VIEWS: 1

DATASETS:
  NAMES: ('veriwild')
  ROOT_DIR: ('/mnt/data/ishant/datasets/')

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  OPTIMIZER_NAME: 'AdamW'
  MAX_EPOCHS: 60
  BASE_LR: 3.5e-4
  IMS_PER_BATCH: 256
  WARMUP_EPOCHS: 5
  WEIGHT_DECAY: 0.05
  CLIP_GRAD: 3.0
  LOG_PERIOD: 50
  EVAL_PERIOD: 5
  SEED: 1234

TEST:
  EVAL: True
  IMS_PER_BATCH: 256
  RE_RANKING: False
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

KD:
  METHOD: 'none'

WANDB:
  PROJECT: 'transreid-kd'

OUTPUT_DIR: 'kd_runs/veriwild/baseline'
